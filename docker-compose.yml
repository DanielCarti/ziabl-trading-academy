version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ziabl-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ziabl:${DB_PASSWORD:-ziabl_secure_pass_2024}@db:5432/ziabl_academy
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://ziabl.ru}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://ziabl.ru}
      - NEXT_PUBLIC_APP_NAME=Ziabl Trade Academy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ziabl-network

  db:
    image: postgres:16-alpine
    container_name: ziabl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziabl
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ziabl_secure_pass_2024}
      POSTGRES_DB: ziabl_academy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziabl -d ziabl_academy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ziabl-network

  nginx:
    image: nginx:alpine
    container_name: ziabl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - ziabl-network

volumes:
  pgdata:
    driver: local

networks:
  ziabl-network:
    driver: bridge
